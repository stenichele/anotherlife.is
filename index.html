<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="description" content="Hello, world. Another Life is taking shape. More soon.">
    <title>Another Life — Hello, world.</title>
    <link rel="canonical" href="https://anotherlife.is/">
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #242923;
        background: #f6f5f0;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: clamp(24px, 5vw, 72px);
        display: flex;
        flex-direction: column;
      }

      header, footer {
        font-size: 13px;
        letter-spacing: 0.035em;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #4f7056;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 0;
        width: min(100%, 1000px);
      }

      .eyebrow {
        margin: 0 0 24px;
        color: #596354;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(58px, 11vw, 150px);
        font-weight: 500;
        line-height: 1.03;
        letter-spacing: -0.065em;
      }

      .intro {
        margin: 32px 0 0;
        color: #62675f;
        font-size: clamp(17px, 2vw, 22px);
        line-height: 1.6;
      }

      footer {
        padding-top: 20px;
        border-top: 1px solid #d8dcd2;
        color: #62675f;
      }
    </style>
  </head>
  <body>
    <header><span class="dot" aria-hidden="true"></span>anotherlife.is</header>
    <main>
      <p class="eyebrow">Another Life</p>
      <h1>Hello, world.</h1>
      <p class="intro">Another Life is taking shape.<br>More soon.</p>
    </main>
    <footer>A beginning.</footer>
  </body>
</html>
